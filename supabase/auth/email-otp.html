<!doctype html>
<html lang="ko">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마음결 로그인 인증번호</title></head>
  <body style="margin:0;background:#f8f6f1;color:#333c35;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6">
    <main style="max-width:440px;margin:0 auto;padding:40px 24px">
      <p style="font-size:15px;letter-spacing:2px">마음결</p>
      <h1 style="font-size:24px;font-weight:500">로그인 인증번호</h1>
      <p>앱의 인증번호 입력란에 아래 번호를 입력해주세요.</p>
      <p style="padding:20px 12px;background:#fff;border-radius:12px;text-align:center;font-size:30px;letter-spacing:6px;font-weight:700">{{ .Token }}</p>
      <p style="font-size:13px;color:#68736c">로그인을 요청하지 않았다면 이 메일을 무시해주세요. 인증번호를 다른 사람에게 알려주지 마세요.</p>
    </main>
  </body>
</html>
